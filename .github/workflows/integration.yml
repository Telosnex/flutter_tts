name: Integration

on:
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on master.
    branches: [master, 'ci/**']
  schedule:
    - cron: '53 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# The example app's integration_test/speak_test.dart on every platform that
# has a text-to-speech engine on its runner. Where the runner has no voice,
# the speaking test is skipped with the reason in the log, and the rest run.
# flutter_tts has no Linux platform, so there is no Linux job.
jobs:
  # The same test in the desktop test runner. The jobs share the steps of the
  # first (YAML anchor).
  desktop-macos-arm64:
    name: macOS ARM64
    runs-on: macos-26
    timeout-minutes: 30
    steps: &desktop_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - run: flutter pub get
        working-directory: example
      # The watchdog runs flutter through bash, which cannot start flutter's
      # .bat wrapper on Windows: there the test runs directly.
      - uses: Telosnex/telosnex_ci_tools/actions/watch@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
        if: runner.os != 'Windows'
        with:
          idle-minutes: '10'
          run: flutter test integration_test/speak_test.dart -d macos -r expanded
          working-directory: example
      # VB-CABLE: the hosted Windows runners have no audio endpoints, and
      # MediaPlayer needs one to play the speech and send its end event.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: tool/ci/install_vbcable.ps1
      - if: runner.os == 'Windows'
        run: flutter test integration_test/speak_test.dart -d windows -r expanded
        working-directory: example

  desktop-windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps: *desktop_steps

  ios:
    name: iOS ARM64 simulator
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - run: flutter pub get
        working-directory: example
      - uses: Telosnex/telosnex_ci_tools/actions/ios-simulator-boot@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
        id: simulator
      - uses: Telosnex/telosnex_ci_tools/actions/ios-flutter-test@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
        with:
          target: integration_test/speak_test.dart
          udid: ${{ steps.simulator.outputs.udid }}
          working-directory: example

  android:
    name: Android x64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - run: flutter pub get
        working-directory: example
      - uses: Telosnex/telosnex_ci_tools/actions/android-emulator@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
        id: emulator
        with:
          api-level: '35'
      - uses: Telosnex/telosnex_ci_tools/actions/watch@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
        with:
          idle-minutes: '10'
          run: flutter test integration_test/speak_test.dart -d ${{ steps.emulator.outputs.serial }} -r expanded
          working-directory: example
      - if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-emulator-logs
          path: |
            ${{ steps.emulator.outputs.log }}
            ${{ steps.emulator.outputs.logcat }}
          if-no-files-found: ignore

  # The same test compiled for Chrome, through web-driver's chromedriver and
  # telosnex_web_test's driver. The jobs share the steps of the first (YAML
  # anchor). Headless Chrome on Linux has no speech-dispatcher, so it has no
  # voice and the speaking test is skipped there.
  web-linux-chrome-dart2js:
    name: Web Linux x64 Chrome dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WASM: ''
    steps: &web_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - run: flutter pub get
        working-directory: example
      - uses: Telosnex/telosnex_ci_tools/actions/web-driver@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
        with:
          browser: chrome
          artifact-name: web-chrome-${{ env.WASM == '' && 'dart2js' || 'dart2wasm' }}
          working-directory: example
          require-result: '.telosnexWebTestSummary.passed >= 1'
          run: |
            flutter drive --release -d web-server --browser-name chrome $WASM \
              --driver test_driver/integration_test.dart \
              --target integration_test/speak_test.dart

  web-linux-chrome-dart2wasm:
    name: Web Linux x64 Chrome dart2wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WASM: --wasm
    steps: *web_steps
